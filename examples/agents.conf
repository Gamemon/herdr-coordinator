# Example agent config for fanout.sh
# Copy to ~/.config/fanout/agents.conf and update pane ids.
#
# Pane ids are NOT stable across herdr restarts — always re-discover them
# with `fanout.sh agents` or `herdr agent list` and update this file.
#
# Format: agent_name = pane_id

goose = w1:p1J
crush = w1:p1K
